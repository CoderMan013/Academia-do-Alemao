<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Academia do Alemão · Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main class="auth">
    <section class="card auth__card">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" />
          </svg>
        </span>
        <h1 class="brand__title">Academia do Alemão</h1>
        <p class="brand__subtitle">Matrículas, planos e mensalidades</p>
      </div>

      <!-- ------------------------------ ENTRAR ------------------------------ -->
      <form class="stack" id="formLogin" autocomplete="on">
        <label class="field">
          <span class="field__label">E-mail</span>
          <input class="input" id="txtEmail" type="email" placeholder="ana@academia.com" required />
        </label>

        <label class="field">
          <span class="field__label">Senha</span>
          <input class="input" id="txtSenha" type="password" placeholder="Senha@123" required />
        </label>

        <button class="btn btn--primary btn--block" id="btnEntrar" type="submit">Entrar</button>

        <p class="hint" id="divResposta" role="status"></p>
      </form>

      <!-- --------------------------- CRIAR CONTA ---------------------------- -->
      <form class="stack" id="formCadastro" hidden>
        <label class="field">
          <span class="field__label">Nome</span>
          <input class="input" id="txtNome" type="text" placeholder="Digite seu nome completo" maxlength="128" />
        </label>

        <label class="field">
          <span class="field__label">E-mail</span>
          <input class="input" id="txtEmailCadastro" type="email" placeholder="voce@email.com" maxlength="64" />
        </label>

        <label class="field">
          <span class="field__label">Senha</span>
          <input class="input" id="txtSenhaCadastro" type="password" placeholder="Senha@123" />
        </label>

        <label class="field">
          <span class="field__label">Confirmar senha</span>
          <input class="input" id="txtSenhaConfirmar" type="password" placeholder="Repita a senha" />
        </label>

        <p class="hint">Mínimo 6 caracteres, com 1 letra maiúscula, 1 número e 1 caractere especial.</p>

        <button class="btn btn--primary btn--block" id="btnCriarConta" type="submit">Criar conta</button>

        <p class="hint" id="divRespostaCadastro" role="status"></p>
      </form>

      <!-- ------------------------------ RODAPÉ ------------------------------ -->
      <div class="auth__foot">
        <p class="hint" id="dicaDemo">Conta de teste: ana@academia.com · Senha@123</p>
        <p class="hint">
          <span id="rodapeTexto">Ainda não tem conta?</span>
          <button class="link" id="btnAlternar" type="button">Criar conta</button>
        </p>
      </div>
    </section>
  </main>

  <script type="module">
    import ApiService from "./ApiService.js";

    const formLogin = document.getElementById("formLogin");
    const formCadastro = document.getElementById("formCadastro");

    const txtEmail = document.getElementById("txtEmail");
    const txtSenha = document.getElementById("txtSenha");
    const divResposta = document.getElementById("divResposta");
    const btnEntrar = document.getElementById("btnEntrar");

    const txtNome = document.getElementById("txtNome");
    const txtEmailCadastro = document.getElementById("txtEmailCadastro");
    const txtSenhaCadastro = document.getElementById("txtSenhaCadastro");
    const txtSenhaConfirmar = document.getElementById("txtSenhaConfirmar");
    const divRespostaCadastro = document.getElementById("divRespostaCadastro");
    const btnCriarConta = document.getElementById("btnCriarConta");

    const btnAlternar = document.getElementById("btnAlternar");
    const rodapeTexto = document.getElementById("rodapeTexto");
    const dicaDemo = document.getElementById("dicaDemo");

    const api = new ApiService(null);

    const REGEX_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const REGEX_ESPECIAL = /[!@#$%^&*(),.?":{}|<>_\-+]/;

    function mensagem(elemento, texto, tipo) {
      elemento.textContent = texto ?? "";
      elemento.className = tipo === "erro" ? "hint hint--error" : tipo === "ok" ? "hint hint--ok" : "hint";
    }

    /* ------------------------- troca entre as telas ------------------------ */

    function irParaLogin() {
      formCadastro.hidden = true;
      formLogin.hidden = false;
      dicaDemo.hidden = false;
      rodapeTexto.textContent = "Ainda não tem conta?";
      btnAlternar.textContent = "Criar conta";
      mensagem(divRespostaCadastro, "");
      txtEmail.focus();
    }

    function irParaCadastro() {
      formLogin.hidden = true;
      formCadastro.hidden = false;
      dicaDemo.hidden = true;
      rodapeTexto.textContent = "Já tem uma conta?";
      btnAlternar.textContent = "Entrar";
      mensagem(divResposta, "");
      txtNome.focus();
    }

    btnAlternar.addEventListener("click", () => {
      if (formCadastro.hidden) irParaCadastro();
      else irParaLogin();
    });

    /* -------------------------------- entrar ------------------------------- */

    formLogin.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const email = txtEmail.value.trim();
      const senha = txtSenha.value.trim();

      if (!email) return mensagem(divResposta, "Informe o e-mail.", "erro");
      if (!senha) return mensagem(divResposta, "Informe a senha.", "erro");

      btnEntrar.disabled = true;
      btnEntrar.textContent = "Entrando...";
      mensagem(divResposta, "");

      const resposta = await api.post("/api/v1/auth/login", { email, senha });

      if (resposta.success === true) {
        localStorage.setItem("userData", JSON.stringify(resposta));
        window.location.href = "dashboard.html";
        return;
      }

      const detalhe = resposta.error?.message || resposta.message || "E-mail ou senha inválidos.";
      mensagem(divResposta, detalhe, "erro");
      btnEntrar.disabled = false;
      btnEntrar.textContent = "Entrar";
    });

    /* ----------------------------- criar conta ---------------------------- */

    formCadastro.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const nome = txtNome.value.trim();
      const email = txtEmailCadastro.value.trim().toLowerCase();
      const senha = txtSenhaCadastro.value;
      const confirmar = txtSenhaConfirmar.value;

      if (nome.length < 3) return mensagem(divRespostaCadastro, "O nome deve ter pelo menos 3 caracteres.", "erro");
      if (!REGEX_EMAIL.test(email)) return mensagem(divRespostaCadastro, "Informe um e-mail válido.", "erro");
      if (senha.length < 6) return mensagem(divRespostaCadastro, "A senha deve ter pelo menos 6 caracteres.", "erro");
      if (!/[A-Z]/.test(senha)) return mensagem(divRespostaCadastro, "A senha deve ter pelo menos uma letra maiúscula.", "erro");
      if (!/[0-9]/.test(senha)) return mensagem(divRespostaCadastro, "A senha deve ter pelo menos um número.", "erro");
      if (!REGEX_ESPECIAL.test(senha)) return mensagem(divRespostaCadastro, "A senha deve ter pelo menos um caractere especial.", "erro");
      if (senha !== confirmar) return mensagem(divRespostaCadastro, "As senhas não conferem.", "erro");

      btnCriarConta.disabled = true;
      btnCriarConta.textContent = "Criando conta...";
      mensagem(divRespostaCadastro, "");

      const resposta = await api.post("/api/v1/auth/registrar", { nome, email, senha });

      if (resposta.success !== true) {
        mensagem(divRespostaCadastro, resposta.error?.message || resposta.message || "Não foi possível criar a conta.", "erro");
        btnCriarConta.disabled = false;
        btnCriarConta.textContent = "Criar conta";
        return;
      }

      // A API já devolve o token: entra direto no painel.
      localStorage.setItem("userData", JSON.stringify(resposta));
      window.location.href = "dashboard.html";
    });

    /* ------------------------------- sessão -------------------------------- */

    const userData = localStorage.getItem("userData");
    if (userData) {
      try {
        const dados = JSON.parse(userData);
        if (dados?.data?.token) window.location.href = "dashboard.html";
      } catch (_) {
        localStorage.removeItem("userData");
      }
    }
  </script>
</body>

</html>
